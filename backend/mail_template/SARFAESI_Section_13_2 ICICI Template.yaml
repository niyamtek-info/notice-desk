  subject:
    title: >
      Notice under Section 13(2) of the Securitisation and Reconstruction
      of Financial Assets and Enforcement of Security Interest Act, 2002
    facility: "Over Draft Facility"
    account_number: "728905000297"
    sanctioned_amount: "₹80,00,000/-"

  salutation: "Dear Sir / Madam,"

  notice_body:
    clauses:
      - clause_no: 1
        text: >
          Under the provisions of the Securitisation and Reconstruction of
          Financial Assets and Enforcement of Security Interest Act, 2002,
          and the Authentication of ICICI Bank Limited appointed under the
          provisions of the said Act, hereby issues legal notice to you
          under Section 13(2) of the Act calling upon you to discharge
          your financial assets and enforcement of security interest.

      - clause_no: 2
        text: >
          You had approached the Bank and requested for granting a Credit
          Overdraft Facility against the secured assets known as OVER DRAFT.
          You have executed the loan agreement and other documents and
          availed the said facility for your business/working capital
          purpose based on representations made by you. Pursuant to the
          said agreement, the Bank sanctioned a Credit Overdraft Facility
          for a sum of ₹80,00,000/- and disbursed the same.

      - clause_no: 3
        text: >
          You have committed defaults in repayment of the dues as per the
          terms and conditions agreed. Despite repeated reminders,
          requests and demands, you failed and neglected to regularize
          the account. Hence, the loan account has been classified as
          Non-Performing Asset (NPA) as per RBI guidelines.

      - clause_no: 4
        text: >
          The entire outstanding liability is secured by way of mortgage
          of the property more particularly mentioned in Annexure “A”
          and the Bank has security interest over the said property.

      - clause_no: 5
        text: >
          Your account has been classified as Non-Performing Asset (NPA)
          on 28/03/2023 and you are liable to pay the total outstanding
          amount of ₹82,62,850.60 as on 02/05/2023 together with further
          interest, penal interest, costs and charges.

      - clause_no: 6
        text: >
          You are hereby called upon to discharge in full your liabilities
          to the Bank within sixty (60) days from the date of receipt of
          this notice, failing which the Bank shall exercise all or any
          of the rights under Section 13(4) of the SARFAESI Act.

      - clause_no: 7
        text: >
          The Bank shall take possession of the secured assets including
          the right to transfer by way of lease, assignment or sale for
          realising the secured assets.

      - clause_no: 8
        text: >
          The Bank may take over the management of the business of the
          borrower and may appoint any person to manage the secured assets.

      - clause_no: 9
        text: >
          The Bank may require any person who has acquired any of the
          secured assets from the borrower and from whom any money is due
          to the borrower to pay such amount to the Bank.

      - clause_no: 10
        text: >
          You are hereby advised to comply with the demand under this
          notice and avoid further action under the aforesaid Act, which
          shall be at your cost and consequences.

