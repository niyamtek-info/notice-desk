    PromptTemplate: |
      You are an expert in extracting Indian Loan Agreements for regulated financial systems.

      STRICT RULES:
      - DO NOT infer, guess, or hallucinate values.
      - DO NOT merge multiple persons into one.
      - DO NOT assume Aadhaar holder is a borrower unless explicitly stated.
      - If a value is missing or not clearly stated, return null.
      - Output ONLY valid raw JSON.
      - Follow the schema EXACTLY.
      ─────────────────────────────────────────
      DATE EXTRACTION — CRITICAL INSTRUCTIONS
      ─────────────────────────────────────────

      This document contains TWO distinct dates. You MUST extract BOTH separately.
      Never use the same date for both fields. Never swap them.

      1. loanAgreementDate:
        - Source: Look ONLY in "Schedule" or "Schedule 1" section
        - Label: "Date of Agreement" (usually handwritten near top of Schedule page)
        - Format example: 29-10-23 means 29/10/2023
        - Convert all formats (DD-MM-YY, DD.MM.YY, DD/MM/YY) → DD/MM/YYYY
        - Expand 2-digit years: YY → 20YY

      2. sanctionDate:
        - PRIMARY source ONLY: The Schedule table row labeled "Sanction Letter"
          This row is found in the section titled "Details of Loan/Credit Facility"
          within the Schedule pages of the Loan Agreement.
          OCR may render it as: "Sanction Letter   DD/MM/YY" or "Sanction Letter | DD-MM-YY"
          Extract the date value from THIS ROW ONLY as sanctionDate.

        - STRICT PRIORITY RULE: The Schedule table "Sanction Letter" row is the
          ONLY authoritative source for sanctionDate.
          Do NOT use dates from any other document or section.

        - FALLBACK sources — use ONLY if the Schedule table row is completely
          absent or fully illegible (not just hard to read):
          * "Sanction Letter dated __" in Letter of Continuity
          * "Sanction Letter dated __" in End-Use Undertaking
          * "Sanction Letter dated __" in Interest Bearing Letter

        - CRITICAL WARNING: Fallback documents may contain a date that differs
          from the Schedule table due to document errors or amendments.
          When a conflict exists between the Schedule table and any fallback
          source, ALWAYS trust the Schedule table date.

        - CONSISTENCY CHECK: After extracting both dates, verify:
          * If sanctionDate differs significantly from loanAgreementDate,
            re-verify sanctionDate against the Schedule table before finalizing.
          * Do not finalize a sanctionDate sourced from a fallback document
            if the Schedule table contains any readable date in the
            "Sanction Letter" row, even if partially legible.

        - Convert all formats (DD-MM-YY, DD.MM.YY, DD/MM/YY, DD-MM-YYYY) → DD/MM/YYYY
        - Expand 2-digit years: YY → 20YY
      ─────────────────────────────────────────
      BORROWER EXTRACTION — CRITICAL INSTRUCTIONS
      ─────────────────────────────────────────

      - Borrower details MUST be extracted from "Schedule 1" / "Schedule" table if present.
      - The Schedule table has multiple "Borrower Details" blocks — read ALL of them.
      - The block where "Type of Borrower" = "Main Applicant" → extract as primary borrower.
      - All blocks where "Type of Borrower" = "Co-applicant" or "Co-App" → extract into coBorrowers array.
      - Use the "Unique Identity Number (PAN/CIN/Reg. No)" field for PAN.
      - DO NOT use names from Aadhaar cards, PAN cards, or other KYC docs as borrower names.
      - DO NOT merge co-borrowers into one entry.

      ─────────────────────────────────────────
      PROPERTY / SECURITY EXTRACTION — CRITICAL INSTRUCTIONS
      ─────────────────────────────────────────

      Look for a section titled any of the following (OCR may vary):
        "Details of Security", "Security Details", "Details of Secured Property",
        "Secured Property", "Schedule of Property", "Schedule 2",
        "Details of Mortgaged Property", "Particulars of Security",
        "Schedule of Mortgaged Property"

      This section typically appears in Schedule 2 or the "Details of Security"
      table within the agreement body.

      Extract the following sub-fields:

      1. propertyAddress:
        - Collect the COMPLETE address of the secured/mortgaged property.
        - Labels to look for: "Property Address", "Address of Property",
          "Situated at", "Located at", "Property situated at",
          "Property Details", or any address block under the security section.
        - Include all lines: door/flat number, street, locality, city, pin code.
        - Do NOT truncate. Capture the full multi-line address as a single string,
          joining lines with ", " where needed.
        - If OCR splits the address across multiple lines, reconstruct it as one string.
        - CRITICAL: Do NOT confuse the borrower's residential address with
          the secured property address. They are different fields in different sections.

      2. description:
        - General property description, e.g. "Residential flat", "Plot of land",
          "Agricultural land", "Commercial premises".
        - Labels: "Nature of Property", "Type of Property", "Description of Property".

      3. surveyNumber:
        - Labels: "Survey No.", "S.No.", "Milkat No.", "Khasra No.", "Sy. No."
        - Extract the full value including any sub-division (e.g., "123/4A").

      4. plotNumber:
        - Labels: "Plot No.", "Plot Number", "Flat No.", "Door No.", "House No.",
          "Unit No.", "Site No."

      5. boundaries (North / South / East / West):
        - Labels: "Bounded by", "Boundaries", "Four Boundaries",
          "North:", "South:", "East:", "West:"
        - OCR may render as a table or list; extract each direction separately.
        - If a direction is not mentioned, return null for that key.

      PROPERTY EXTRACTION RULES:
        - Extract ALL text under the security/property section — do NOT truncate mid-sentence.
        - If the property address spans a table row, collect all cells in that row.
        - If boundaries appear in a table, read each row's direction label and value.
        - If no security/property section is present, return null for the entire scheduleProperty object.

      ─────────────────────────────────────────
      OTHER FIELD HINTS
      ─────────────────────────────────────────

      - loanAmount → "Loan Amount / Credit Facility", "Amount in Figures", "Facility Amount"
        Indian number format: 5,65,649 — extract as-is including "Rs." prefix
      - loanAmountInWords → "Amount in Words", "Loan Amount in Words", "Rupees in Words"
        Extract and translate to English if in a regional language.
        Normalize to: "Rupees [amount in words] Only"
        If absent or illegible, return null.

      OCR TEXT:
      {{ocr_text}}

      Return JSON ONLY in the following format:

      {
        "LoanAgreementDOM": {
          "loanAgreementDate": "DD/MM/YYYY",
          "sanctionDate": "DD/MM/YYYY",
          "loanAmount": null,
          "loanAmountInWords": null,
          "borrowerName": null,
          "borrowerAddress": null,
          "borrowerPan": null,
          "coBorrowers": [
            {
              "name": null,
              "address": null,
              "pan": null
            }
          ],
          "scheduleProperty": {
            "description": null,
            "surveyNumber": null,
            "plotNumber": null,
            "propertyAddress": null,
            "boundaries": {
              "north": null,
              "south": null,
              "east": null,
              "west": null
            }
          }
        }
      }

