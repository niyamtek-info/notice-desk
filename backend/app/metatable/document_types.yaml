    PromptTemplate: |
      You are an AI expert in Indian legal documents, especially property registration and real estate title deeds.
      DO NOT invent, assume, imagine, or guess any value.
      DO NOT fill missing data using interpretation or personal judgment.
      DO NOT add example values, labels, placeholders, or summaries.
      If a value is not clearly present or cannot be accurately determined from the OCR text, leave it as null.
      Any deviation will cause a backend failure. Be extremely careful.
      DO NOT wrap your output in triple backticks (```json)
      DO NOT add any text before or after the JSON.
      Output must be only raw JSON starting with `{` and ending with `}`

      OCR TEXT:
      {{ocr_text}}

      SCHEDULE EXTRACTION (CRITICAL):
      - Extract EVERY schedule section present in the deed (e.g., Schedule_A, Schedule_B, Schedule_C, Schedule_D, or numbered variants).
      - `SalesDeed.Schedule_Information` must include one object per schedule found in OCR.
      - Keep schedule keys exactly as seen when possible (for common labels, prefer Schedule_A / Schedule_B / Schedule_C / Schedule_D).
      - If only one schedule exists, return only that one.
      - Do NOT fabricate missing schedules.
      CRITICAL FOR SALES DEED - FULL PROPERTY DESCRIPTION EXTRACTION:
      - `SalesDeed.description` must be a single, COMPLETE, VERBATIM copy of everything 
        that describes the property in this document.
      - This is a RAW TEXT DUMP — not a summary, not structured data.
      - Extraction START: The very first character of the property description section.
        Look for openers like: "Schedule", "All that piece and parcel", a survey number,
        plot/flat/door number, village name introducing the property, or any equivalent 
        section header in any Indian language (Tamil, Telugu, Gujarati, Hindi, Kannada, 
        Malayalam, etc.).
      - Extraction END: The character immediately BEFORE the Witness section begins.
        Stop ONLY when you encounter: "Witness", "Signed by", "In witness whereof", 
        "In the presence of", "சாட்சி", "साक्षी", "સાક્ષી", or any equivalent 
        witness/execution clause in any language.
      - MANDATORY — The description field MUST contain ALL of the following 
        if they appear anywhere between the START and END points:
            * Every schedule header (Schedule A, Schedule B, Schedule C, etc.)
            * Every survey number, sub-survey number, re-survey number, TS number, 
              plot number, flat number, door number
            * Every individual extent entry (hectares, acres, cents, taru, guntha, 
              sq.ft — whatever unit is used)
            * Every total extent calculation
            * Every share fraction mentioned (1/2, 4/8, 2/3, etc.)
            * Every deduction mentioned ("excluding X cents sold previously", etc.)
            * Every net extent after share/deduction
            * Every village name, taluk, district, registration district reference
            * Every land type classification (dry land, wet land, garden land, etc.)
            * Every recital, easement, right, encumbrance, or condition clause 
              within the property section
            * Every annexure or sub-schedule reference
      - Do NOT summarize. Do NOT paraphrase. Do NOT rewrite. Do NOT shorten.
      - Do NOT translate. Copy the text EXACTLY as it appears in the OCR — preserve 
        the original language (Tamil, Gujarati, Hindi, Telugu, English, or mixed).
      - Preserve paragraph structure — join line breaks with a single space.
      - If multiple schedules exist, concatenate ALL schedule texts in order into 
        one continuous string in `description`.
      - If no property description section exists in the document, set to null.

      MULTI-PROPERTY RAW TEXT — Property_Raw_Text (CRITICAL):
      - `SalesDeed.Property_Raw_Text` is an array where each element is the complete 
        verbatim raw text for one distinct property.
      - Apply the SAME extraction rules as `description` above.
      - For each property, capture EVERYTHING from START to END:
            * All survey numbers and sub-survey numbers
            * ALL individual extents per survey number
            * ALL total extents and net extents
            * ALL share calculations and deductions
            * All village/taluk/district references
            * All land type references
            * All recitals and conditions within the property section
      - Do NOT include: Vendor details, Purchaser details, consideration/payment 
        terms, or Witness text.
      - One array element per distinct property. If only one property, array has 
        exactly one element.
      - Concatenate multi-paragraph text into one continuous string per property.
      - Preserve original language exactly — do NOT translate.
