    PromptTemplate: |
      You are an expert in extracting Indian Loan Sanction Letters.

      STRICT RULES:
      - Do NOT assume or infer values.
      - Extract only what is explicitly present.
      - Missing values must be null.
      - Output ONLY valid raw JSON.
      - No extra text, no markdown.

      FIELD HINTS:
        - loanAccountNumber → Look for "Subject:", "Loan Account No", "Ref No", alphanumeric strings like "LGFL..."
        - borrowerName → "Main Applicant", "Borrower", "Applicant Name"
        - borrowerAddress → "Main Applicant Address", "Address", "Applicant Address"
        - coBorrowers → "Co-borrower", "Guarantor", "Name of Guarantor(s)", listed names after the borrower block
        - sanctionDate → Look for "Date:" label (often handwritten near top of letter), or "Sanction Date", or "Date of Sanction".
                        Accept formats: DD/MM/YYYY, DD-MM-YYYY, DD.MM.YY, DD.MM.YYYY. Convert to DD/MM/YYYY on output.
        - sanctionAmount → "Loan Amount Sanctioned", "Amount Sanctioned", "Sanctioned Amount".
                          May be formatted as Indian numbering (e.g., 5,65,649). Extract as-is including "Rs." prefix.
        - loanAmount → Same as sanctionAmount if only one amount is present; otherwise the disbursed amount
        - loanTenure → "Tenure of the Loan", "Tenure", expressed in months or years
        - interestRate → Any value followed by "% p.a" or "per annum", prefer the final applicable rate
        - emiAmount → "Installment Amount", "EMI", "Graded Installments", amount followed by "for a period of"
        - repaymentFrequency → "Frequency of repayment", "Interest Payable"
      IMPORTANT DATE EXTRACTION:
        - The sanction date is often handwritten near the top of the document next to the label "Date:"
        - OCR may render it with dots or dashes, e.g. "29.10.23" means 29/10/2023
        - Always expand 2-digit years: YY → 20YY
        - If date appears as garbled text near "Date:" at top of letter, attempt to parse it

      IMPORTANT AMOUNT EXTRACTION:
        - Indian numeric format uses commas differently: 5,65,649 = 565649
        - Always include the "Rs." prefix and original formatting in output
        - Do not convert or reformat the number

      ─────────────────────────────────────────
      PROPERTY / SECURITY EXTRACTION — CRITICAL INSTRUCTIONS
      ─────────────────────────────────────────

      Look for a section titled any of the following (OCR may vary):
        "Details of Security", "Security Details", "Details of Secured Property",
        "Secured Property", "Schedule of Property", "Property Details",
        "Details of Mortgaged Property", "Particulars of Security"

      This section typically appears near the bottom of the sanction letter or as an annexed schedule.

      Extract the following sub-fields:

      1. propertyAddress:
        - Collect the COMPLETE address of the secured/mortgaged property.
        - Labels to look for: "Property Address", "Address of Property",
          "Situated at", "Located at", "Property situated at",
          "Property Details", or any address block under the security section.
        - Include all lines: door/flat number, street, locality, city, pin code.
        - Do NOT truncate. Capture the full multi-line address as a single string,
          joining lines with ", " where needed.
        - If OCR splits the address across multiple lines, reconstruct it into one string.

      2. description:
        - General property description, e.g. "Residential flat", "Plot of land",
          "Agricultural land", "Commercial premises".
        - Labels: "Nature of Property", "Type of Property", "Description of Property",
          "Details of Property".

      3. surveyNumber:
        - Labels: "Survey No.", "S.No.", "Milkat No.", "Khasra No.", "Sy. No."
        - Extract the full value including any sub-division (e.g., "123/4A").

      4. plotNumber:
        - Labels: "Plot No.", "Plot Number", "Flat No.", "Door No.", "House No.",
          "Unit No.", "Site No."
        - Extract as-is.

      5. boundaries (North / South / East / West):
        - Labels: "Bounded by", "Boundaries", "Four Boundaries",
          "North:", "South:", "East:", "West:"
        - OCR may render as a table or list; extract each direction separately.
        - If a direction is not mentioned, return null for that key.

      PROPERTY EXTRACTION RULES:
        - Extract ALL text under the security/property section — do NOT truncate mid-sentence.
        - If the property address spans a table row, collect all cells in that row.
        - If boundaries appear in a table, read each row's direction label and value.
        - If no security/property section is present, return null for the entire scheduleProperty object.
        - Do NOT confuse the borrower's residential address with the secured property address.

      OCR TEXT:
      {{ocr_text}}

      Instruction:
        Extract in JSON format.
        Do not return a list.

        {
          "SanctionLetterDOM": {
            "loanAccountNumber": "",
            "borrowerName": "",
            "borrowerAddress": "",
            "coBorrowers": [
              {
                "coBorrowerName": "",
                "coBorrowerAddress": ""
              }
            ],
            "sanctionDate": "DD/MM/YYYY",
            "sanctionAmount": "",
            "loanAmount": "",
            "loanTenure": "",
            "interestRate": "",
            "emiAmount": "",
            "repaymentFrequency": "",
            "scheduleProperty": {
              "description": null,
              "surveyNumber": null,
              "plotNumber": null,
              "propertyAddress": null,
              "boundaries": {
                "north": null,
                "south": null,
                "east": null,
                "west": null
              }
            }
          }
        }

